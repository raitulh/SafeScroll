services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safescroll
      POSTGRES_USER: safescroll
      POSTGRES_PASSWORD: safescroll
    ports: ["5432:5432"]
    volumes: ["safescroll_pg:/var/lib/postgresql/data"]
    healthcheck: {test:["CMD-SHELL","pg_isready -U safescroll -d safescroll"],interval:5s,timeout:5s,retries:10}
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck: {test:["CMD","redis-cli","ping"],interval:5s,timeout:5s,retries:10}
  api:
    build: {context: ../apps/api}
    environment:
      APP_ENV: production
      APP_VERSION: 1.0.0
      AUTO_CREATE_DB: "false"
      DATABASE_URL: postgresql+asyncpg://safescroll:safescroll@postgres:5432/safescroll
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:1.7b
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: change-me-in-production
      RULES_REQUIRE_SIGNATURE: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes: {safescroll_pg: {}}
