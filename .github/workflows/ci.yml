name: SafeScroll CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile python sources
        run: python -m compileall app

      - name: Run pytest test suite
        run: python -m pytest -q

  frontend:
    name: Frontend & Packages CI (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build detection-core
        run: pnpm --filter @safescroll/detection-core build

      - name: Typecheck web
        run: pnpm --filter @safescroll/web typecheck

      - name: Typecheck extension
        run: pnpm --filter @safescroll/extension typecheck

      - name: Run unit test suites
        run: pnpm test
