[project]
name = "safescroll-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25,<26",
  "cryptography>=46,<47",
  "prometheus-fastapi-instrumentator>=7,<8",
  "email-validator>=2.2,<3",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
